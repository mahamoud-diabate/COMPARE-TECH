services:
  - type: web
    name: compare-tech-api
    runtime: node
    plan: free
    # Pas de rootDir : Render rend invisible tout ce qui est hors du dossier
    # racine, au build comme a l'execution, et l'API lit ../shared. Le service
    # part donc de la racine du depot et entre dans backend/ a chaque commande.
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    autoDeploy: true
    # Chemins relatifs a la racine du depot : un changement dans shared/
    # redeploie l'API, un changement du seul frontend non.
    buildFilter:
      paths:
        - backend/**
        - shared/**
    healthCheckPath: /api/health
    envVars:
      # sync: false => la valeur se saisit dans le tableau de bord Render,
      # jamais dans ce fichier (qui est versionne).
      - key: DB_URI
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # Second fournisseur possible pour /api/ai/verdict : Gemini passe en
      # premier s'il est configure, DeepSeek prend le relais sinon.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: CORS_ORIGINS
        sync: false
      - key: NODE_ENV
        value: production
      # Sans rootDir, Render ne lit plus `engines` de backend/package.json.
      # require(esm) de shared/ exige Node >= 20.19.
      - key: NODE_VERSION
        value: '22'
