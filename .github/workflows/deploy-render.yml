# Déploiement de l'API sur Render, déclenché par la CI plutôt que par le webhook.
#
# Pourquoi ce détour : l'app GitHub de Render est installée sur le dépôt, mais
# aucun webhook n'arrive au service — le dépôt n'en porte aucun et Render →
# Events ne montre que des déploiements manuels. Le service tire toujours son
# code par l'ancienne autorisation personnelle, qui ne notifie plus les push.
# Ce workflow rétablit l'automatisme par l'autre bout : la CI valide `main`,
# puis on appelle le deploy hook du service.
#
# Prérequis, une seule fois (côté dépôt GitHub) :
#   Settings → Secrets and variables → Actions → New repository secret
#   Nom : RENDER_DEPLOY_HOOK
#   Valeur : l'URL du Deploy Hook du service (Render → Settings → Deploy Hook)
#
# Sans ce secret, le workflow ne casse rien : il s'arrête sur un avertissement
# et le déploiement reste manuel (Render → Manual Deploy → Deploy latest commit).
name: Déploiement Render

on:
  # Relance à la main possible : Actions → Déploiement Render → Run workflow.
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Un seul déploiement à la fois, et le plus récent gagne : deux pushs
  # rapprochés ne doivent pas lancer deux builds qui se marchent dessus.
  group: deploy-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Déployer l'API
    # Une CI rouge ne déploie jamais. Pas de filtre sur les fichiers modifiés :
    # un push peut contenir plusieurs commits ; ne regarder que le dernier
    # laisserait passer en silence un changement du serveur.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le deploy hook de Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -eu
          if [ -z "${HOOK:-}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK absent : déploiement Render non déclenché. Ajoute le secret (Settings → Secrets and variables → Actions), ou lance Manual Deploy dans Render."
            exit 0
          fi
          code=$(curl -sS -o /tmp/hook.out -w '%{http_code}' -X POST "$HOOK")
          echo "Réponse du deploy hook : HTTP $code"
          head -c 300 /tmp/hook.out || true
          echo
          case "$code" in
            2*) echo "Déploiement demandé. Suivi : Render → Deploys." ;;
            *) echo "::error::Le deploy hook a répondu HTTP $code"; exit 1 ;;
          esac
